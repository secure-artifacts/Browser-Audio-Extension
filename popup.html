<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>浏览器拉线助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/48.png" width="30" height="30" alt=""><h1>浏览器拉线助手</h1><span class="tag">测试版</span></header>
  <main>
    <div class="control">
      <div><strong>拉线模式</strong><p id="state" role="status" aria-live="polite">正在读取…</p></div>
      <button id="toggle" type="button" role="switch" aria-checked="false" aria-label="拉线模式" disabled><span></span></button>
    </div>
    <div class="page-status" id="page-status" data-tone="neutral"><span class="dot"></span><strong id="page-state" role="status" aria-live="polite">正在检测当前网页…</strong></div>
    <p class="hint" id="hint">安装或切换后，请刷新通话网页，再重新通话。</p>
    <p class="note">仅检测网页麦克风设置，不代表对方已收到声音。<br>安装或切换后需刷新网页 · <span id="version"></span></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
